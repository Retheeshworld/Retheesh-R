<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Retheeshworld — Profile README Preview</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.5.1/github-markdown-dark.min.css">
  <style>
    body {
      background-color: #050807;
      margin: 0;
      padding: 24px;
      display: flex;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
    }
    .preview-container {
      max-width: 980px;
      width: 100%;
      background-color: #0B100D;
      border: 1px solid #193B28;
      border-radius: 10px;
      padding: 32px 40px;
      box-shadow: 0 0 25px rgba(0, 255, 156, 0.12);
    }
    .markdown-body {
      background-color: transparent !important;
      color: #E5F5E9 !important;
      font-family: inherit;
    }
    .markdown-body a {
      color: #00FF9C;
      text-decoration: none;
    }
    .markdown-body a:hover {
      text-decoration: underline;
      color: #39FF14;
    }
    .markdown-body table tr {
      background-color: #050807 !important;
      border-top: 1px solid #193B28;
    }
    .markdown-body table tr:nth-child(2n) {
      background-color: #08100C !important;
    }
    .markdown-body table th, .markdown-body table td {
      border: 1px solid #193B28 !important;
      color: #E5F5E9;
    }
    .markdown-body pre, .markdown-body code {
      background-color: #050807 !important;
      color: #39FF14 !important;
      border: 1px solid #193B28;
    }
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 16px;
      margin-bottom: 24px;
      border-bottom: 1px solid #193B28;
      color: #8AA596;
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
      font-size: 13px;
    }
    .badge-live {
      color: #39FF14;
      border: 1px solid #39FF14;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 11px;
      letter-spacing: 0.1em;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
  <div class="preview-container">
    <div class="header-bar">
      <span>root@retheeshworld:~$ preview README.md</span>
      <span class="badge-live">● LOCAL PREVIEW ACTIVE</span>
    </div>
    <div id="content" class="markdown-body">
      <p style="color: #00FF9C; font-family: monospace;">Loading Markdown renderer...</p>
    </div>
  </div>

  <script>
    fetch('./README.md')
      .then(res => res.text())
      .then(md => {
        // Parse markdown with marked.js
        document.getElementById('content').innerHTML = marked.parse(md);
      })
      .catch(err => {
        document.getElementById('content').innerHTML = '<p style="color: #FF5F56;">Error loading README.md: ' + err + '</p>';
      });
  </script>
</body>
</html>
